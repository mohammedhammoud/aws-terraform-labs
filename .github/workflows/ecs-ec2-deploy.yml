name: ECS EC2 Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          # - stage
          # - prod
      skip_application:
        description: Skip application deploy steps
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  TERRAFORM_ENVIRONMENT: ${{ inputs.environment }}
  PROJECT_NAME: ecs-ec2

concurrency:
  group: ecs-ec2-${{ inputs.environment }}-deploy
  cancel-in-progress: false

jobs:
  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: eu-north-1
      TERRAFORM_DIRECTORY: infra/ecs-ec2/terraform
      TERRAFORM_VERSION: "1.12.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ECS_EC2_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-apply

      - name: Verify assumed identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Terraform apply
        uses: ./.github/actions/terraform-apply
        with:
          terraform-directory: ${{ env.TERRAFORM_DIRECTORY }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          terraform-state-key: ${{ format('aws-terraform-labs/{0}/{1}/terraform.tfstate', env.PROJECT_NAME, env.TERRAFORM_ENVIRONMENT) }}
          terraform-vars-json: >-
            {
              "environment": "${{ env.TERRAFORM_ENVIRONMENT }}",
              "backend_image_tag": "bootstrap",
              "backend_desired_count": 0,
              "sns_email": "${{ secrets.SNS_EMAIL }}"
            }

  backend:
    if: ${{ !inputs.skip_application }}
    name: Backend
    needs: infrastructure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: eu-north-1
      TERRAFORM_VERSION: "1.12.2"
      TERRAFORM_DIRECTORY: infra/ecs-ec2/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ECS_EC2_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ecs-ec2-deploy

      - name: Verify assumed identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Read Terraform outputs
        id: terraform-outputs
        uses: ./.github/actions/terraform-outputs
        with:
          terraform-directory: ${{ env.TERRAFORM_DIRECTORY }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          terraform-state-key: ${{ format('aws-terraform-labs/{0}/{1}/terraform.tfstate', env.PROJECT_NAME, env.TERRAFORM_ENVIRONMENT) }}

      - name: Resolve deployment values
        id: deployment-values
        env:
          TERRAFORM_OUTPUTS_JSON: ${{ steps.terraform-outputs.outputs.json }}
        shell: bash
        run: |
          set -euo pipefail

          output_string() {
            local name="$1"
            local value

            value="$(jq -r --arg name "$name" '.[$name] // empty' <<< "$TERRAFORM_OUTPUTS_JSON")"

            if [[ -z "$value" || "$value" == "null" ]]; then
              echo "Missing required Terraform output: $name" >&2
              exit 1
            fi

            echo "$value"
          }

          output_csv() {
            local name="$1"
            local value

            value="$(
              jq -r \
                --arg name "$name" \
                '.[$name] | if type == "array" and length > 0 then join(",") else empty end' \
                <<< "$TERRAFORM_OUTPUTS_JSON"
            )"

            if [[ -z "$value" || "$value" == "null" ]]; then
              echo "Missing required Terraform output: $name" >&2
              exit 1
            fi

            echo "$value"
          }

          {
            echo "ecs-cluster=$(output_string ecs_cluster_name)"
            echo "backend-service=$(output_string backend_ecs_service_name)"
            echo "backend-ecr-repository=$(output_string backend_ecr_repository_url)"
            echo "backend-security-group-id=$(output_string backend_security_group_id)"
            echo "private-subnet-ids=$(output_csv private_subnet_ids)"
            echo "backend-task-definition-arn=$(output_string backend_task_definition_arn)"
            echo "migration-task-definition-arn=$(output_string backend_migration_task_definition_arn)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build backend
        uses: ./.github/actions/docker-build-push
        with:
          context: apps/todo
          dockerfile: apps/todo/backend/Dockerfile
          repository: ${{ steps.deployment-values.outputs.backend-ecr-repository }}
          image-tag: ${{ github.sha }}

      - name: Register backend task definition
        id: register-backend
        uses: ./.github/actions/ecs-register-task-definition
        with:
          task-definition: ${{ steps.deployment-values.outputs.backend-task-definition-arn }}
          image: ${{ steps.deployment-values.outputs.backend-ecr-repository }}:${{ github.sha }}

      - name: Register migration task definition
        id: register-migration
        uses: ./.github/actions/ecs-register-task-definition
        with:
          task-definition: ${{ steps.deployment-values.outputs.migration-task-definition-arn }}
          image: ${{ steps.deployment-values.outputs.backend-ecr-repository }}:${{ github.sha }}

      - name: Run migration
        uses: ./.github/actions/ecs-run-task
        with:
          cluster: ${{ steps.deployment-values.outputs.ecs-cluster }}
          task-definition: ${{ steps.register-migration.outputs.task-definition-arn }}
          launch-type: EC2
          subnet-ids: ${{ steps.deployment-values.outputs.private-subnet-ids }}
          security-group-ids: ${{ steps.deployment-values.outputs.backend-security-group-id }}

      - name: Deploy backend
        uses: ./.github/actions/ecs-update-service
        with:
          cluster: ${{ steps.deployment-values.outputs.ecs-cluster }}
          service: ${{ steps.deployment-values.outputs.backend-service }}
          task-definition: ${{ steps.register-backend.outputs.task-definition-arn }}
          desired-count: "2"

      - name: Wait for services
        env:
          ECS_CLUSTER: ${{ steps.deployment-values.outputs.ecs-cluster }}
          BACKEND_SERVICE: ${{ steps.deployment-values.outputs.backend-service }}
        shell: bash
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services \
              "$BACKEND_SERVICE"

  frontend:
    if: ${{ !inputs.skip_application }}
    name: Frontend
    needs: infrastructure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: eu-north-1
      TERRAFORM_VERSION: "1.12.2"
      TERRAFORM_DIRECTORY: infra/ecs-ec2/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ECS_EC2_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ecs-ec2-deploy

      - name: Verify assumed identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Read Terraform outputs
        id: terraform-outputs
        uses: ./.github/actions/terraform-outputs
        with:
          terraform-directory: ${{ env.TERRAFORM_DIRECTORY }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          terraform-state-key: ${{ format('aws-terraform-labs/{0}/{1}/terraform.tfstate', env.PROJECT_NAME, env.TERRAFORM_ENVIRONMENT) }}

      - name: Resolve deployment values
        id: deployment-values
        env:
          TERRAFORM_OUTPUTS_JSON: ${{ steps.terraform-outputs.outputs.json }}
        shell: bash
        run: |
          set -euo pipefail

          output_string() {
            local name="$1"
            local value

            value="$(jq -r --arg name "$name" '.[$name] // empty' <<< "$TERRAFORM_OUTPUTS_JSON")"

            if [[ -z "$value" || "$value" == "null" ]]; then
              echo "Missing required Terraform output: $name" >&2
              exit 1
            fi

            echo "$value"
          }

          {
            echo "alb-dns-name=$(output_string alb_dns_name)"
            echo "frontend-bucket=$(output_string frontend_s3_bucket_name)"
            echo "frontend-distribution-id=$(output_string frontend_cloudfront_distribution_id)"
            echo "frontend-deploy-role-arn=$(output_string frontend_deploy_role_arn)"
            echo "backend-cloudfront-domain-name=$(output_string backend_cloudfront_domain_name)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/todo/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/todo
        run: npm ci

      - name: Build frontend
        working-directory: apps/todo
        env:
          VITE_API_URL: ${{ format('https://{0}', steps.deployment-values.outputs.backend-cloudfront-domain-name) }}/api
        run: |
          set -euo pipefail

          npm run build --workspace @todo/shared
          npm run build --workspace @todo/frontend

      - name: Write frontend runtime config
        working-directory: apps/todo
        env:
          VITE_API_URL: ${{ format('https://{0}', steps.deployment-values.outputs.backend-cloudfront-domain-name) }}/api
        run: |
          set -euo pipefail

          jq -n --arg apiUrl "$VITE_API_URL" '{ API_URL: $apiUrl }' > frontend/dist/config.json

      - name: Validate frontend config
        working-directory: apps/todo
        env:
          VITE_API_URL: ${{ format('https://{0}', steps.deployment-values.outputs.backend-cloudfront-domain-name) }}/api
        run: |
          set -euo pipefail

          jq -e --arg apiUrl "$VITE_API_URL" '.API_URL == $apiUrl' frontend/dist/config.json > /dev/null

      - name: Configure frontend deployment credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.deployment-values.outputs.frontend-deploy-role-arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: frontend-deploy

      - name: Deploy frontend to S3
        env:
          FRONTEND_BUCKET: ${{ steps.deployment-values.outputs.frontend-bucket }}
        run: |
          set -euo pipefail

          aws s3 sync \
            apps/todo/frontend/dist \
            "s3://${FRONTEND_BUCKET}" \
            --delete

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ steps.deployment-values.outputs.frontend-distribution-id }}
        run: |
          set -euo pipefail

          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
