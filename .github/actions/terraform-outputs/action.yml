name: Terraform outputs
description: Read Terraform outputs as JSON

inputs:
  working-directory:
    description: Terraform directory
    required: true

  terraform-version:
    description: Terraform version
    required: false
    default: "1.12.2"

outputs:
  json:
    description: Terraform outputs as compact JSON
    value: ${{ steps.outputs.outputs.json }}

runs:
  using: composite

  steps:
    - name: Validate inputs
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        if [[ ! -d "$WORKING_DIRECTORY" ]]; then
          echo "Terraform working directory not found: $WORKING_DIRECTORY" >&2
          exit 1
        fi

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: Terraform init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform init -input=false

    - name: Read outputs
      id: outputs
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        outputs="$(
          terraform output -json |
          jq -c 'with_entries(select(.value.sensitive != true) | .value = .value.value)'
        )"

        if [[ -z "$outputs" || "$outputs" == "null" || "$outputs" == "{}" ]]; then
          echo "Terraform returned no outputs in: $WORKING_DIRECTORY" >&2
          exit 1
        fi

        echo "json=$outputs" >> "$GITHUB_OUTPUT"
