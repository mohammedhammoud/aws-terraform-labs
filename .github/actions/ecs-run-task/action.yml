name: Run ECS task
description: Run an ECS task and require exit code 0

inputs:
  cluster:
    description: ECS cluster name or ARN
    required: true

  task-definition:
    description: ECS task definition ARN or family:revision
    required: true

  launch-type:
    description: ECS launch type
    required: true

  subnet-ids:
    description: Comma-separated subnet IDs
    required: true

  security-group-ids:
    description: Comma-separated security group IDs
    required: true

runs:
  using: composite

  steps:
    - name: Run task
      shell: bash
      env:
        INPUT_CLUSTER: ${{ inputs.cluster }}
        INPUT_TASK_DEFINITION: ${{ inputs.task-definition }}
        INPUT_LAUNCH_TYPE: ${{ inputs.launch-type }}
        INPUT_SUBNET_IDS: ${{ inputs.subnet-ids }}
        INPUT_SECURITY_GROUP_IDS: ${{ inputs.security-group-ids }}
      run: |
        set -euo pipefail

        run_task_output="$(mktemp)"
        describe_task_output="$(mktemp)"
        trap 'rm -f "$run_task_output" "$describe_task_output"' EXIT

        aws ecs run-task \
          --cluster "$INPUT_CLUSTER" \
          --launch-type "$INPUT_LAUNCH_TYPE" \
          --task-definition "$INPUT_TASK_DEFINITION" \
          --network-configuration "awsvpcConfiguration={subnets=[$INPUT_SUBNET_IDS],securityGroups=[$INPUT_SECURITY_GROUP_IDS],assignPublicIp=DISABLED}" \
          > "$run_task_output"

        task_arn="$(jq -r '.tasks[0].taskArn // empty' "$run_task_output")"

        if [[ -z "$task_arn" || "$task_arn" == "null" ]]; then
          failure_reason="$(jq -r '.failures[0].reason // empty' "$run_task_output")"
          echo "ECS task failed to start${failure_reason:+: $failure_reason}" >&2
          exit 1
        fi

        aws ecs wait tasks-stopped \
          --cluster "$INPUT_CLUSTER" \
          --tasks "$task_arn"

        aws ecs describe-tasks \
          --cluster "$INPUT_CLUSTER" \
          --tasks "$task_arn" \
          > "$describe_task_output"

        if ! jq -e '.tasks[0].containers[0]' "$describe_task_output" > /dev/null; then
          echo "Stopped task has no containers[0]: $task_arn" >&2
          exit 1
        fi

        exit_code="$(jq -r '.tasks[0].containers[0].exitCode // empty' "$describe_task_output")"
        stopped_reason="$(jq -r '.tasks[0].stoppedReason // empty' "$describe_task_output")"

        if [[ -z "$exit_code" || "$exit_code" == "null" ]]; then
          echo "Task stopped without an exit code${stopped_reason:+: $stopped_reason}" >&2
          exit 1
        fi

        if [[ "$exit_code" != "0" ]]; then
          echo "Task exited with code ${exit_code}${stopped_reason:+: $stopped_reason}" >&2
          exit 1
        fi
