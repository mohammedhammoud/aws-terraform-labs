name: Register ECS task definition
description: Register a task definition revision with a new image

inputs:
  task-definition:
    description: Task definition ARN or family:revision
    required: true

  image:
    description: Container image URI
    required: true

outputs:
  task-definition-arn:
    description: Registered task definition ARN
    value: ${{ steps.register.outputs.task-definition-arn }}

runs:
  using: composite

  steps:
    - name: Register task definition
      id: register
      shell: bash
      env:
        INPUT_TASK_DEFINITION: ${{ inputs.task-definition }}
        INPUT_IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail

        source_file="$(mktemp)"
        updated_file="$(mktemp)"
        trap 'rm -f "$source_file" "$updated_file"' EXIT

        aws ecs describe-task-definition \
          --task-definition "$INPUT_TASK_DEFINITION" \
          --query taskDefinition \
          > "$source_file"

        if ! jq -e '.containerDefinitions[0]' "$source_file" > /dev/null; then
          echo "Task definition has no containerDefinitions[0]: $INPUT_TASK_DEFINITION" >&2
          exit 1
        fi

        jq \
          --arg image "$INPUT_IMAGE" \
          '
            .containerDefinitions[0].image = $image
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
          ' \
          "$source_file" \
          > "$updated_file"

        task_definition_arn="$(
          aws ecs register-task-definition \
            --cli-input-json "file://${updated_file}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text
        )"

        if [[ -z "$task_definition_arn" || "$task_definition_arn" == "None" ]]; then
          echo "Failed to register task definition: $INPUT_TASK_DEFINITION" >&2
          exit 1
        fi

        echo "task-definition-arn=$task_definition_arn" >> "$GITHUB_OUTPUT"
