name: Terraform plan
description: Run Terraform format, validate, and plan

inputs:
  terraform-directory:
    required: true

  terraform-version:
    required: false
    default: "1.12.2"

  terraform-vars-json:
    required: false
    default: "{}"

  terraform-state-key:
    required: true

outputs:
  plan:
    description: Terraform plan output
    value: ${{ steps.plan.outputs.plan }}

  exit-code:
    description: Terraform plan exit code
    value: ${{ steps.plan.outputs.exit-code }}

runs:
  using: composite

  steps:
    - name: Validate inputs
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.terraform-directory }}
        TERRAFORM_VARS: ${{ inputs.terraform-vars-json }}
      run: |
        set -euo pipefail

        if [[ ! -d "$WORKING_DIRECTORY" ]]; then
          echo "Terraform working directory not found: $WORKING_DIRECTORY" >&2
          exit 1
        fi

        jq -e 'type == "object" and all(keys[]; length > 0)' <<< "$TERRAFORM_VARS" > /dev/null

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: Terraform format
      shell: bash
      working-directory: ${{ inputs.terraform-directory }}
      run: terraform fmt -check -recursive

    - name: Terraform init
      shell: bash
      working-directory: ${{ inputs.terraform-directory }}
      env:
        TERRAFORM_BACKEND_KEY: ${{ inputs.terraform-state-key }}
      run: |
        set -euo pipefail

        terraform init \
          -input=false \
          -backend-config="key=$TERRAFORM_BACKEND_KEY"

    - name: Terraform validate
      shell: bash
      working-directory: ${{ inputs.terraform-directory }}
      run: terraform validate

    - name: Terraform plan
      id: plan
      shell: bash
      working-directory: ${{ inputs.terraform-directory }}
      env:
        TERRAFORM_VARS: ${{ inputs.terraform-vars-json }}
      run: |
        set -euo pipefail

        mapfile -d '' -t var_args < <(
          jq -rj 'to_entries[] | "-var=\(.key)=\(.value | tostring)\u0000"' <<< "$TERRAFORM_VARS"
        )

        set +e
        terraform plan \
          -input=false \
          -no-color \
          -detailed-exitcode \
          "${var_args[@]}" \
          > terraform-plan.txt 2>&1
        exit_code=$?
        set -e

        cat terraform-plan.txt

        delimiter="TERRAFORM_PLAN_$(date +%s%N)"
        {
          echo "plan<<$delimiter"
          cat terraform-plan.txt
          echo "$delimiter"
          echo "exit-code=$exit_code"
        } >> "$GITHUB_OUTPUT"

        case "$exit_code" in
          0) ;;
          2) ;;
          *) exit "$exit_code" ;;
        esac
