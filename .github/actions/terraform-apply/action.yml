name: Terraform apply
description: Run Terraform format, validate, and apply an exact saved plan

inputs:
  working-directory:
    description: Terraform directory
    required: true

  terraform-version:
    description: Terraform version
    required: false
    default: "1.12.2"

  terraform-vars:
    description: Terraform variables as a JSON object
    required: false
    default: "{}"

  plan-file:
    description: Terraform binary plan file name
    required: false
    default: tfplan

runs:
  using: composite

  steps:
    - name: Validate inputs
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        TERRAFORM_VARS: ${{ inputs.terraform-vars }}
        PLAN_FILE: ${{ inputs.plan-file }}
      run: |
        set -euo pipefail

        if [[ ! -d "$WORKING_DIRECTORY" ]]; then
          echo "Terraform working directory not found: $WORKING_DIRECTORY" >&2
          exit 1
        fi

        if [[ ! "$PLAN_FILE" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "Invalid Terraform plan file name: $PLAN_FILE" >&2
          exit 1
        fi

        jq -e 'type == "object" and all(keys[]; length > 0)' <<< "$TERRAFORM_VARS" > /dev/null

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: Terraform format
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform fmt -check -recursive

    - name: Terraform init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform init -input=false

    - name: Terraform validate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform validate

    - name: Terraform apply
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TERRAFORM_VARS: ${{ inputs.terraform-vars }}
        PLAN_FILE: ${{ inputs.plan-file }}
      run: |
        set -euo pipefail

        trap 'rm -f -- "$PLAN_FILE"' EXIT

        mapfile -d '' -t var_args < <(
          jq -rj 'to_entries[] | "-var=\(.key)=\(.value | tostring)\u0000"' <<< "$TERRAFORM_VARS"
        )

        terraform plan \
          -input=false \
          -no-color \
          -out="$PLAN_FILE" \
          "${var_args[@]}"

        terraform apply \
          -input=false \
          -no-color \
          "$PLAN_FILE"
